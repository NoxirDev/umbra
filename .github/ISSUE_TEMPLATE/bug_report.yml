name: Bug Report
description: Сообщить об ошибке в UMBRA
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - NoxirDev

body:
  - type: markdown
    attributes:
      value: |
        Спасибо за помощь в улучшении UMBRA! Пожалуйста, заполните форму ниже.

  - type: checkboxes
    id: checklist
    attributes:
      label: Предварительная проверка
      description: Перед созданием issue, пожалуйста, проверьте:
      options:
        - label: Я проверил [существующие issues](https://github.com/NoxirDev/umbra/issues) и не нашёл дубликатов
          required: true
        - label: Я прочитал [документацию](https://github.com/NoxirDev/umbra/tree/main/docs)
          required: true
        - label: Я использую последнюю версию UMBRA
          required: true

  - type: input
    id: version
    attributes:
      label: Версия UMBRA
      description: Какую версию вы используете?
      placeholder: "2.1.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      description: На какой ОС возникла проблема?
      options:
        - Windows 11
        - Windows 10
        - Windows 8.1
        - Другая (укажите в описании)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Описание проблемы
      description: Подробно опишите, что произошло
      placeholder: Расскажите, что пошло не так...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      description: Как воспроизвести проблему?
      placeholder: |
        1. Открыть настройки
        2. Перейти в раздел...
        3. Нажать на...
        4. Увидеть ошибку
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти?
      placeholder: Опишите, как должно работать правильно...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло на самом деле?
      placeholder: Опишите, что произошло вместо этого...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи и ошибки
      description: Скопируйте сообщения об ошибках из консоли (если есть)
      placeholder: |
        Вставьте логи здесь...
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты
      description: Добавьте скриншоты, если это поможет объяснить проблему
      placeholder: Перетащите изображения сюда...

  - type: dropdown
    id: severity
    attributes:
      label: Серьёзность
      description: Насколько критична эта проблема?
      options:
        - Критическая (приложение не запускается)
        - Высокая (основная функция не работает)
        - Средняя (неудобство, но есть workaround)
        - Низкая (косметическая проблема)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: Любая другая информация, которая может помочь
      placeholder: |
        - Используемые интеграции (Twitch, DA, и т.д.)
        - Настройки, которые могут влиять
        - Другие установленные программы
        - И т.д.

  - type: checkboxes
    id: terms
    attributes:
      label: Согласие
      options:
        - label: Я согласен следовать [Code of Conduct](https://github.com/NoxirDev/umbra/blob/main/docs/CONTRIBUTING.md)
          required: true
