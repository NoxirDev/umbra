<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src wss://irc-ws.chat.twitch.tv wss://ws-us2.pusher.com wss://socket.donationalerts.ru wss://centrifugo.donatepay.ru https://fonts.googleapis.com;">
<title>UMBRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--void:#050508;--surface:rgba(13,13,20,0.88);--border:#1a1f2e;--glow:#ffffff;--glow-muted:#a8a8b3;--text-dim:#6b6b78;--text:#e8e8ed;--kick:#53fc18;--api:#ffc832;}
/* THEMES */
body[data-theme="minimal"]{--void:#000000;--surface:rgba(20,20,20,0.95);--border:#333333;--glow:#ffffff;--glow-muted:#cccccc;}
body[data-theme="neon"]{--void:#0a0014;--surface:rgba(20,0,40,0.9);--border:#ff00ff;--glow:#00ffff;--glow-muted:#ff00ff;}
body[data-theme="dark"]{--void:#000000;--surface:rgba(10,10,10,0.95);--border:#1a1a1a;--glow:#888888;--glow-muted:#666666;}
body[data-theme="matrix"]{--void:#000000;--surface:rgba(0,10,0,0.9);--border:#00ff00;--glow:#00ff00;--glow-muted:#00aa00;}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Inter',sans-serif;color:var(--text);user-select:none;}
#app{display:flex;flex-direction:column;height:100vh;padding:8px;gap:6px;}
#goal{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:10px 14px;backdrop-filter:blur(12px);flex-shrink:0;transition:opacity .4s,max-height .4s;}
#goal.hidden{opacity:0;pointer-events:none;max-height:0;padding:0;border:none;margin:0;}
.goal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.goal-title{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;color:var(--glow-muted);}
.goal-amount{font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--glow);text-shadow:0 0 8px var(--glow);}
.goal-bar{height:5px;background:rgba(5,5,8,0.8);border-radius:3px;overflow:hidden;position:relative;}
#goal-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--glow-muted),var(--glow));border-radius:3px;transition:width .5s ease;box-shadow:0 0 8px var(--glow);position:relative;}
#goal-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shimmer 2s infinite;}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#don-alert{display:none;position:relative;overflow:hidden;background:var(--surface);border:1px solid rgba(255,255,255,0.15);border-radius:4px;padding:14px 16px;backdrop-filter:blur(12px);flex-shrink:0;}
#don-alert.show{display:flex;flex-direction:column;gap:6px;animation:popIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{0%{transform:scale(.9) translateY(-8px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.don-row{display:flex;align-items:center;gap:10px;}
#don-icon{font-size:16px;}
#don-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--glow);text-shadow:0 0 10px var(--glow);}
#don-amount{margin-left:auto;font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--glow);letter-spacing:1px;border:1px solid rgba(255,255,255,0.2);padding:2px 10px;border-radius:2px;}
#don-text{font-size:12px;color:var(--glow-muted);line-height:1.4;}
#don-alert::before,#don-alert::after{content:'';position:absolute;width:12px;height:12px;border:1px solid rgba(255,255,255,0.3);}
#don-alert::before{top:0;left:0;border-right:none;border-bottom:none;}
#don-alert::after{bottom:0;right:0;border-left:none;border-top:none;}
#msgs-wrap{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:4px;backdrop-filter:blur(12px);overflow:hidden;display:flex;flex-direction:column;min-height:0;transition:opacity .5s;}
#msgs-wrap.autohidden{opacity:0;pointer-events:none;}
#msgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth;}
#msgs::-webkit-scrollbar{width:3px;}
#msgs::-webkit-scrollbar-track{background:transparent;}
#msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg{display:flex;flex-direction:column;gap:2px;background:rgba(5,5,8,0.6);border-radius:2px;padding:7px 10px;font-size:13px;line-height:1.4;animation:msgIn .2s ease-out;border-left:2px solid transparent;word-break:break-word;}
@keyframes msgIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:translateX(0)}}
.msg.twitch{border-left-color:#9147ff;}
.msg.youtube{border-left-color:#ff0000;}
.msg.kick{border-left-color:var(--kick);background:rgba(83,252,24,0.03);}
.msg.kick .msg-author{color:var(--kick);text-shadow:0 0 8px var(--kick);}
.msg.da,.msg.dx{border-left-color:var(--glow);background:rgba(255,255,255,0.03);}
.msg.da .msg-author,.msg.dx .msg-author{color:var(--glow);text-shadow:0 0 8px var(--glow);}
.msg.api .msg-author{color:var(--api);}
.msg-top{display:flex;align-items:center;gap:5px;margin-bottom:2px;}
.badge{font-family:'Bebas Neue',sans-serif;font-size:9px;letter-spacing:1px;padding:1px 5px;border-radius:2px;}
.b-tw{background:rgba(145,71,255,.25);color:#c084fc;}.b-yt{background:rgba(255,0,0,.2);color:#f87171;}
.b-da{background:rgba(255,255,255,.1);color:var(--glow-muted);}.b-dx{background:rgba(255,255,255,.1);color:var(--glow-muted);}
.b-kick{background:rgba(83,252,24,.15);color:var(--kick);}.b-api{background:rgba(255,200,50,.12);color:var(--api);}
.b-test{background:rgba(255,255,255,.08);color:var(--text-dim);}
.msg-author{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:var(--glow-muted);}
.msg-time{margin-left:auto;font-size:10px;color:var(--text-dim);}
.msg-text{color:var(--text);font-size:12px;}
#resize-handle{position:fixed;bottom:0;right:0;width:18px;height:18px;cursor:se-resize;-webkit-app-region:no-drag;z-index:9999;opacity:0.2;transition:opacity .2s;}
#resize-handle:hover{opacity:0.6;}
#goal{cursor:move;}
#goal:active{opacity:0.85;}
.pt{position:fixed;pointer-events:none;font-size:16px;animation:floatUp 1.5s ease-out forwards;z-index:9999;}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-80px) scale(.3);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="goal">
    <div class="goal-header">
      <span class="goal-title" id="goal-title">STREAM GOAL</span>
      <span class="goal-amount" id="goal-text">0 / 0</span>
    </div>
    <div class="goal-bar"><div id="goal-fill"></div></div>
  </div>
  <div id="don-alert">
    <div class="don-row">
      <span id="don-icon">🎉</span>
      <span id="don-name">Username</span>
      <span id="don-amount">100</span>
    </div>
    <div id="don-text"></div>
  </div>
  <div id="msgs-wrap"><div id="msgs"></div></div>
</div>
<div id="resize-handle">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
    <path d="M16 2L2 16M16 8L8 16M16 14L14 16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {

// Глобальный обработчик ошибок
window.addEventListener('error', (e) => { console.error('[Overlay] error:', e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { console.error('[Overlay] promise rejection:', e.reason); });

const API = window.overlayAPI || {
  setOpacity:()=>{}, toggleClickThrough:()=>{}, mouseOverUI:()=>{},
  closeOverlay:()=>{}, openSettings:()=>{}, requestSettings:()=>{},
  onApplySettings:()=>{}, onTestDonation:()=>{}, onGoalReset:()=>{},
  resizeOverlay:()=>{}, startResize:()=>{}, stopResize:()=>{},
  startMove:()=>{}, stopMove:()=>{}, updateUIBounds:()=>{},
  onResizeTick:()=>{}, onApiEvent:()=>{}
};
let settings={}, clickThrough=false, filter='all';
let messages=[], blockedWords=[];
const MAX_RECONNECT_ATTEMPTS=10;
const MAX=100;
let goalCurrent=0, goalTarget=100, goalInited=false;
let comboSum=0, comboTimer=null, comboCount=0, comboPending=null;
let tWS=null, tRecon=false, tAttempt=0;
let autoHideTimer=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;').replace(/`/g,'&#x60;').replace(/\//g,'&#x2F;');}
function safeColor(c){return /^#[0-9a-fA-F]{6}$/.test(c)?c:'#a8a8b3';}
function makeEl(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;}
function getDelay(a){return Math.min(2000*Math.pow(2,a),30000);}
function rColor(name){const c=['#f87171','#fb923c','#fbbf24','#34d399','#60a5fa','#c084fc','#f472b6','#67e8f9'];let h=0;for(let i=0;i<(name||'').length;i++)h=name.charCodeAt(i)+((h<<5)-h);return c[Math.abs(h)%c.length];}

// SETTINGS
API.onApplySettings((s)=>{
  // Специальные сигналы от глобальных хоткеев
  if(s._clearChat){messages=[];render();return;}
  if(s._clickThrough!==undefined){
    // Main уже применил setIgnoreMouseEvents — просто обновляем локальную переменную
    clickThrough=s._clickThrough;
    return;
  }

  // Проверяем изменились ли подключения — переподключаем только если да
  const isFirstLoad = !settings.twitchChannel && !settings.daToken && !settings.dxToken && !settings.kickChannel;
  const needReconnect = isFirstLoad ||
    settings.twitchChannel !== s.twitchChannel ||
    settings.daToken !== s.daToken ||
    settings.dxToken !== s.dxToken ||
    settings.kickChannel !== s.kickChannel ||
    settings.youtubeVideoId !== s.youtubeVideoId;

  settings=s;
  API.setOpacity(s.opacity/100);

  // Apply theme
  if(s.theme) document.body.setAttribute('data-theme', s.theme);

  // Apply font size
  if(s.fontSize) {
    document.querySelectorAll('.msg-text').forEach(el => el.style.fontSize = s.fontSize + 'px');
  }

  // goalCurrent — только при первом запуске
  if(!goalInited){
    goalCurrent=Math.max(0, isNaN(parseInt(s.goalCurrent)) ? 0 : parseInt(s.goalCurrent));
    goalInited=true;
  }
  // goalTarget = 0 означает скрытую цель, не подставляем дефолт
  goalTarget=Math.max(0, isNaN(parseInt(s.goalTarget)) ? 0 : parseInt(s.goalTarget));

  const te=document.getElementById('goal-title');
  if(te) te.textContent=s.goalTitle||'STREAM GOAL';
  document.getElementById('goal').classList.toggle('hidden', goalTarget<=0);
  updateGoalBar();

  blockedWords=s.chatFilter?s.chatFilter.split(',').map(w=>w.trim().toLowerCase()).filter(Boolean):[];

  // compactMode
  const compact = s.compactMode===true;
  document.getElementById('app').classList.toggle('compact', compact);

  resetAutoHide();
  if(needReconnect) reconnectAll();
});

// GOAL
function updateGoalBar(){
  const pct=Math.min(100,goalTarget>0?(goalCurrent/goalTarget)*100:0);
  document.getElementById('goal-fill').style.width=pct+'%';
  document.getElementById('goal-text').textContent=goalCurrent+' / '+goalTarget;
}
function addToGoal(amount){const num=parseFloat(amount);const safe=isNaN(num)?0:Math.max(0,num);if(safe>0){goalCurrent+=safe;updateGoalBar();}}

// COMBO
function handleDonation(amount,name,msg,platform){
  const safe=Math.max(0,Number(amount)||0);if(safe<=0)return;
  addToGoal(safe);comboSum+=safe;comboCount++;
  comboPending={name:name||'anonymous',amount:safe,msg:msg||'',platform:platform||'da'};
  if(comboTimer)clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>{
    if(comboCount===1){showDon(comboPending.name,String(comboPending.amount),comboPending.msg,comboPending.platform);}
    else{showDon('COMBO x'+comboCount,String(comboSum),'🔥 DONATION COMBO',comboPending.platform);}
    comboSum=0;comboCount=0;comboPending=null;
  },5000);
}

// AUTO-HIDE
function resetAutoHide(){
  const wrap=document.getElementById('msgs-wrap');
  wrap.classList.remove('autohidden');
  if(autoHideTimer)clearTimeout(autoHideTimer);
  const delay=(settings.autoHide||0)*1000;
  if(delay>0) autoHideTimer=setTimeout(()=>wrap.classList.add('autohidden'),delay);
}

// MESSAGES
function addMsg(platform,author,text,color,isDon,amount){
  const lower=text.toLowerCase();
  for(const w of blockedWords){if(lower.includes(w))return;}
  const time=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const last=messages[messages.length-1];
  if(last&&last.author===author&&last.text===text&&last.platform===platform&&!last.isDon&&!isDon){
    last.count=(last.count||1)+1;last.time=time;render();return;
  }
  messages.push({platform,author,text,color,isDon,amount,time,count:1});
  if(messages.length>MAX)messages.shift();
  render();
  resetAutoHide();
}

function render(){
  const list=document.getElementById('msgs');
  list.innerHTML='';
  const bm={twitch:'b-tw',youtube:'b-yt',da:'b-da',dx:'b-dx',kick:'b-kick',api:'b-api',test:'b-test'};
  const lm={twitch:'TW',youtube:'YT',da:'DA',dx:'DX',kick:'KICK',api:'API',test:'TEST'};
  messages.forEach(m=>{
    if(filter!=='all'&&filter!=='don'&&m.platform!==filter)return;
    if(filter==='don'&&!m.isDon)return;
    const msg=makeEl('div','msg '+m.platform);
    const top=makeEl('div','msg-top');
    top.appendChild(makeEl('span','badge '+(bm[m.platform]||'b-api'),lm[m.platform]||m.platform.toUpperCase()));
    const auth=makeEl('span','msg-author',m.author);
    if(/^#[0-9a-fA-F]{6}$/.test(m.color))auth.style.color=safeColor(m.color);
    top.appendChild(auth);
    if(m.count>1)top.appendChild(makeEl('span','msg-time','x'+m.count));
    top.appendChild(makeEl('span','msg-time',m.time));
    msg.appendChild(top);
    msg.appendChild(makeEl('div','msg-text',m.count>1?m.text+' (x'+m.count+')':m.text));
    list.appendChild(msg);
  });
  list.scrollTop=list.scrollHeight;
}

// DONATION POPUP
let donTimer=null;
const _ac=new (window.AudioContext||window.webkitAudioContext)();
document.addEventListener('click',()=>{if(_ac.state==='suspended')_ac.resume().catch(()=>{});});
_ac.resume().catch(()=>{});

function playDonationSound(){
  if(!settings.donationSound)return;
  const volume = (settings.soundVolume || 50) / 100;
  const type = settings.soundType || 'default';

  try{
    if(_ac.state==='suspended')_ac.resume();

    if(type === 'bell') {
      [800, 1000, 1200].forEach((freq, i) => {
        const osc=_ac.createOscillator(),gain=_ac.createGain();
        osc.connect(gain);gain.connect(_ac.destination);
        osc.frequency.value=freq;osc.type='sine';
        gain.gain.setValueAtTime(0,_ac.currentTime+i*0.1);
        gain.gain.linearRampToValueAtTime(volume*0.3,_ac.currentTime+i*0.1+0.05);
        gain.gain.exponentialRampToValueAtTime(0.01,_ac.currentTime+i*0.1+0.5);
        osc.start(_ac.currentTime+i*0.1);osc.stop(_ac.currentTime+i*0.1+0.5);
      });
    } else if(type === 'coin') {
      [1000, 1500].forEach((freq, i) => {
        const osc=_ac.createOscillator(),gain=_ac.createGain();
        osc.connect(gain);gain.connect(_ac.destination);
        osc.frequency.value=freq;osc.type='square';
        gain.gain.setValueAtTime(volume*0.2,_ac.currentTime+i*0.05);
        gain.gain.exponentialRampToValueAtTime(0.01,_ac.currentTime+i*0.05+0.1);
        osc.start(_ac.currentTime+i*0.05);osc.stop(_ac.currentTime+i*0.05+0.1);
      });
    } else if(type === 'fanfare') {
      [523, 659, 784, 1047].forEach((freq, i) => {
        const osc=_ac.createOscillator(),gain=_ac.createGain();
        osc.connect(gain);gain.connect(_ac.destination);
        osc.frequency.value=freq;osc.type='triangle';
        gain.gain.setValueAtTime(volume*0.25,_ac.currentTime+i*0.15);
        gain.gain.exponentialRampToValueAtTime(0.01,_ac.currentTime+i*0.15+0.3);
        osc.start(_ac.currentTime+i*0.15);osc.stop(_ac.currentTime+i*0.15+0.3);
      });
    } else {
      // default
      [880,1320,1760].forEach((freq,i)=>{
        const osc=_ac.createOscillator(),gain=_ac.createGain();
        osc.connect(gain);gain.connect(_ac.destination);
        osc.frequency.value=freq;osc.type='sine';
        gain.gain.setValueAtTime(0,_ac.currentTime+i*0.15);
        gain.gain.linearRampToValueAtTime(volume*0.3,_ac.currentTime+i*0.15+0.05);
        gain.gain.linearRampToValueAtTime(0,_ac.currentTime+i*0.15+0.3);
        osc.start(_ac.currentTime+i*0.15);osc.stop(_ac.currentTime+i*0.15+0.3);
      });
    }
  }catch(e){}
}

function showDon(name,amount,msg,platform){
  clearTimeout(donTimer);
  document.getElementById('don-name').textContent=esc(name);
  document.getElementById('don-amount').textContent=esc(amount);
  document.getElementById('don-text').textContent=esc(msg);
  document.getElementById('don-icon').textContent=platform==='dx'?'💎':platform==='kick'?'🟢':platform==='api'?'⚡':'🎉';
  const alert=document.getElementById('don-alert');
  alert.classList.remove('show');void alert.offsetWidth;alert.classList.add('show');
  playDonationSound();spawnParticles();
  const durSec = isNaN(parseInt(settings.donationDuration)) ? 8 : parseInt(settings.donationDuration);
  if(durSec>0) donTimer=setTimeout(()=>alert.classList.remove('show'),durSec*1000);
}

function spawnParticles(){
  const emojis=['🎉','✨','⭐','💫','🌟'];
  for(let i=0;i<6;i++){
    setTimeout(()=>{
      const p=makeEl('div','pt');
      p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      p.style.left=(20+Math.random()*60)+'%';
      p.style.bottom='100px';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),1500);
    },i*100);
  }
}

// RESIZE — main считает всё сам через getSize() + getCursorScreenPoint()
(function(){
  const handle=document.getElementById('resize-handle');
  let active=false;
  handle.addEventListener('mousedown',e=>{
    active=true;
    e.preventDefault();e.stopPropagation();
    API.startResize();
  });
  window.addEventListener('mouseup',()=>{if(!active)return;active=false;API.stopResize();});
  window.addEventListener('blur',()=>{if(active){active=false;API.stopResize();}});
})();

// MOVE — goal блок как ручка перемещения
(function(){
  const goal=document.getElementById('goal');
  let active=false;
  goal.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    active=true;
    e.preventDefault();
    API.startMove();
  });
  window.addEventListener('mouseup',()=>{if(!active)return;active=false;API.stopMove();});
  window.addEventListener('blur',()=>{if(active){active=false;API.stopMove();}});
})();

// HOTKEYS
document.addEventListener('keydown',e=>{
  const hk=settings.hotkeys||{};
  const key=(e.ctrlKey?'Ctrl+':'')+(e.shiftKey?'Shift+':'')+(e.altKey?'Alt+':'')+e.key;
  if(hk.clickThrough&&key===hk.clickThrough){setClickThrough(!clickThrough);return;}
  if(hk.clearChat&&key===hk.clearChat){messages=[];document.getElementById('msgs').innerHTML='';return;}
  if(hk.hideOverlay&&key===hk.hideOverlay){API.closeOverlay();return;}
  if(hk.openSettings&&key===hk.openSettings){API.openSettings();return;}
  if(!hk.clickThrough&&e.key==='End')setClickThrough(!clickThrough);
});

function setClickThrough(on){
  clickThrough=on;
  API.toggleClickThrough(on);
  if(on) sendUIBounds(); // при включении сразу шлём bounds
}

// Отправляем bounds всех UI элементов в main для polling
function sendUIBounds(){
  const ids=['goal','msgs-wrap','resize-handle','don-alert'];
  const bounds=[];
  for(const id of ids){
    const el=document.getElementById(id);
    if(!el)continue;
    const r=el.getBoundingClientRect();
    if(r.width>0&&r.height>0) bounds.push({x:Math.floor(r.left),y:Math.floor(r.top),w:Math.ceil(r.width),h:Math.ceil(r.height)});
  }
  API.updateUIBounds(bounds);
}

// Обновляем bounds при resize окна
window.addEventListener('resize', ()=>{ if(clickThrough) sendUIBounds(); });

// SERVICE FACTORY
function createService(dotId,reconnectFn){
  let ws=null,recon=false,attempt=0;
  function disconnect(){recon=false;if(ws){ws.onclose=null;ws.close();ws=null;}}
  function connect(url,onOpen,onMessage){
    disconnect();recon=true;
    ws=new WebSocket(url);
    ws.onopen=()=>{attempt=0;onOpen(ws);};
    ws.onmessage=e=>{try{onMessage(ws,e.data);}catch(err){}};
    ws.onerror=()=>{};
    ws.onclose=()=>{if(recon)setTimeout(reconnectFn,getDelay(attempt++));};
    return ws;
  }
  return{connect,disconnect,getWs:()=>ws};
}

// TWITCH
function twitchDisconnect(){tRecon=false;if(tWS){tWS.onclose=null;tWS.close();tWS=null;}}
function twitchConnect(){
  if(!settings.twitchChannel){twitchDisconnect();return;}
  twitchDisconnect();tRecon=true;
  const ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  tWS=ws;
  ws.onopen=()=>{
    tAttempt=0;
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS oauth:justinfan'+Math.floor(Math.random()*99999));
    ws.send('NICK justinfan'+Math.floor(Math.random()*99999));
    ws.send('JOIN #'+settings.twitchChannel.toLowerCase());
  };
  ws.onmessage=e=>{
    e.data.split('\r\n').forEach(line=>{
      if(!line)return;
      if(line.startsWith('PING')){ws.send('PONG :tmi.twitch.tv');return;}
      let tags={},rest=line;
      if(line.startsWith('@')){
        const sp=line.indexOf(' ');
        line.slice(1,sp).split(';').forEach(t=>{const eq=t.indexOf('=');if(eq!==-1)tags[t.slice(0,eq)]=t.slice(eq+1);});
        rest=line.slice(sp+1);
      }
      if(rest.includes('PRIVMSG')){
        const mm=rest.match(/PRIVMSG #\S+ :(.+)/s);
        const nm=rest.match(/:(\w+)!/);
        if(mm&&nm){const author=tags['display-name']||nm[1];addMsg('twitch',author,mm[1].trim(),tags['color']||rColor(author),false,null);}
      }
    });
  };
  ws.onerror=()=>{};
  ws.onclose=()=>{if(tRecon)setTimeout(twitchConnect,getDelay(tAttempt++));};
}

// DONATION ALERTS
const daService=createService('da',()=>daConnect());
function daConnect(){
  if(!settings.daToken){daService.disconnect();return;}
  let ping=null,auth=false;
  daService.connect(
    'wss://socket.donationalerts.ru:443/socket.io/?EIO=4&transport=websocket',
    ()=>{},
    (ws,data)=>{
      if(data.startsWith('0')&&!auth){ws.send('40');return;}
      if((data==='40'||data.startsWith('40{'))&&!auth){
        auth=true;
        ws.send('42["add-user",{"token":"'+settings.daToken.trim()+'","type":"minor"}]');
        ping=setInterval(()=>{if(ws.readyState===1)ws.send('3');},20000);
        return;
      }
      if(data==='2'){ws.send('3');return;}
      if(data.startsWith('42')){
        try{
          const p=JSON.parse(data.slice(2));
          if(Array.isArray(p)&&p[0]==='donation'){
            const don=typeof p[1]==='string'?JSON.parse(p[1]):p[1];
            const amt=don.amount+' '+don.currency;
            addMsg('da',don.username||'anonymous',amt+(don.message?': '+don.message:''),'#a8a8b3',true,amt);
            handleDonation(don.amount,don.username||'anonymous',don.message||'','da');
          }
        }catch(e){}
      }
    }
  );
  const ws=daService.getWs();
  if(ws){const prev=ws.onclose;ws.onclose=()=>{clearInterval(ping);auth=false;if(prev)prev();};}
}

// DONATEX
const dxService=createService('dx',()=>dxConnect());
function dxConnect(){
  if(!settings.dxToken){dxService.disconnect();return;}
  dxService.connect(
    'wss://centrifugo.donatepay.ru/connection/websocket',
    (ws)=>ws.send(JSON.stringify({params:{token:settings.dxToken.trim()},id:1})),
    (ws,data)=>{
      if(data==='{}'){ws.send('{}');return;}
      let d;try{d=JSON.parse(data);}catch(e){return;}
      if(!d)return;
      if(d.id===1&&d.result&&d.result.client){ws.send(JSON.stringify({method:1,params:{channel:'$public:'+d.result.client},id:2}));}
      if(d.id===undefined&&!d.push){ws.send('{}');return;}
      if(d.push&&d.push.pub&&d.push.pub.data){
        const n=d.push.pub.data.notification;
        if(n&&n.type==='donation'){
          const amt=n.sum+' ₽';
          addMsg('dx',n.name||'anonymous',amt+(n.comment?': '+n.comment:''),'#a8a8b3',true,amt);
          handleDonation(n.sum,n.name||'anonymous',n.comment||'','dx');
        }
      }
    }
  );
}

// KICK
const kickService=createService('kick',()=>kickConnect());
function kickConnect(){
  if(!settings.kickChannel){kickService.disconnect();return;}
  kickService.connect(
    'wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=7.6.0&flash=false',
    ()=>{},
    (ws,data)=>{
      let d;try{d=JSON.parse(data);}catch{return;}
      if(!d)return;
      if(d.event==='pusher:connection_established'){
        ws.send(JSON.stringify({event:'pusher:subscribe',data:{auth:'',channel:'chatrooms.'+settings.kickChannel+'.v2'}}));
        return;
      }
      if(d.event==='pusher:ping'){ws.send(JSON.stringify({event:'pusher:pong',data:{}}));return;}
      if(d.event==='App\\Events\\ChatMessageEvent'){
        try{
          const msg=typeof d.data==='string'?JSON.parse(d.data):d.data;
          const author=msg.sender?.username||'anonymous';
          const text=msg.content||'';
          const color=msg.sender?.identity?.color||'#53fc18';
          addMsg('kick',author,text,safeColor(color),false,null);
        }catch{}
      }
    }
  );
}

// API EVENTS
if(API.onApiEvent){
  API.onApiEvent((ev)=>{
    if(!ev||!ev.type)return;
    if(ev.type==='donation'){
      const p=ev.payload||{};
      const name=String(p.name||'anonymous');
      const amount=String(p.amount||'0');
      const message=String(p.message||'');
      const display=amount+(p.currency?' '+p.currency:'');
      addMsg('api',name,display+(message?': '+message:''),'#ffc832',true,display);
      handleDonation(parseFloat(amount)||0,name,message,'api');
    }
    if(ev.type==='message'){const p=ev.payload||{};addMsg(p.platform||'api',p.author||'API',p.text||'',p.color||'#ffc832',false,null);}
    if(ev.type==='alert'){
      const p=ev.payload||{};
      showDon(p.title||'ALERT','',p.text||'','api');
      document.getElementById('don-icon').textContent=p.icon||'📢';
    }
  });
}
