<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src wss://irc-ws.chat.twitch.tv wss://ws-us2.pusher.com wss://socket.donationalerts.ru https://www.googleapis.com https://fonts.googleapis.com;">
<title>UMBRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="goal">
    <div class="goal-header">
      <span class="goal-title" id="goal-title">STREAM GOAL</span>
      <span class="goal-amount" id="goal-text">0 / 0</span>
    </div>
    <div class="goal-bar"><div id="goal-fill"></div></div>
  </div>
  <div id="don-alert">
    <div class="don-row">
      <span id="don-icon">🎉</span>
      <span id="don-name">Username</span>
      <span id="don-amount">100</span>
    </div>
    <div id="don-text"></div>
  </div>
  <div id="msgs-wrap"><div id="msgs"></div></div>
</div>
<div id="resize-handle">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
    <path d="M16 2L2 16M16 8L8 16M16 14L14 16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
</div>

<!-- Load utilities first -->
<script src="../../shared/utils.js"></script>

<!-- Load UI modules -->
<script src="ui/chat.js"></script>
<script src="ui/donations.js"></script>
<script src="ui/goal.js"></script>
<script src="ui/particles.js"></script>

<!-- Load services -->
<script src="services/twitch.js"></script>
<script src="services/kick.js"></script>
<script src="services/youtube.js"></script>
<script src="services/donation-alerts.js"></script>

<!-- Load utils -->
<script src="utils/audio.js"></script>

<!-- Main overlay logic -->
<script src="overlay.js"></script>
</body>
</html>
