<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMBRA API Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { margin-bottom: 20px; color: #fff; }
    .section {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section h2 { margin-bottom: 15px; color: #4CAF50; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #aaa; }
    input, textarea {
      width: 100%;
      padding: 10px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
    }
    button {
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }
    button:hover { background: #45a049; }
    button.secondary { background: #2196F3; }
    button.secondary:hover { background: #0b7dda; }
    button.danger { background: #f44336; }
    button.danger:hover { background: #da190b; }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .status.connected { background: #1b5e20; border: 1px solid #4CAF50; }
    .status.disconnected { background: #b71c1c; border: 1px solid #f44336; }
    .log {
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    .log-entry { margin-bottom: 5px; }
    .log-entry.donation { color: #4CAF50; }
    .log-entry.message { color: #2196F3; }
    .log-entry.alert { color: #FF9800; }
    .log-entry.error { color: #f44336; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 UMBRA API Demo</h1>

    <!-- Connection -->
    <div class="section">
      <h2>Connection</h2>
      <div class="form-group">
        <label>API Key:</label>
        <input type="text" id="apiKey" placeholder="Enter your API key">
      </div>
      <div id="connectionStatus" class="status disconnected">
        ❌ Disconnected
      </div>
      <button onclick="connectWebSocket()">Connect WebSocket</button>
      <button class="secondary" onclick="disconnectWebSocket()">Disconnect</button>
    </div>

    <!-- Send Donation -->
    <div class="section">
      <h2>💰 Send Donation</h2>
      <div class="form-group">
        <label>Name:</label>
        <input type="text" id="donName" value="Test User">
      </div>
      <div class="form-group">
        <label>Amount:</label>
        <input type="number" id="donAmount" value="100">
      </div>
      <div class="form-group">
        <label>Message:</label>
        <textarea id="donMessage" rows="3">Great stream! Keep it up!</textarea>
      </div>
      <button onclick="sendDonation()">Send Donation</button>
    </div>

    <!-- Send Message -->
    <div class="section">
      <h2>💬 Send Message</h2>
      <div class="form-group">
        <label>Author:</label>
        <input type="text" id="msgAuthor" value="ChatBot">
      </div>
      <div class="form-group">
        <label>Text:</label>
        <input type="text" id="msgText" value="Hello from API!">
      </div>
      <button onclick="sendMessage()">Send Message</button>
    </div>

    <!-- Send Alert -->
    <div class="section">
      <h2>🔔 Send Alert</h2>
      <div class="form-group">
        <label>Title:</label>
        <input type="text" id="alertTitle" value="NEW FOLLOWER">
      </div>
      <div class="form-group">
        <label>Text:</label>
        <input type="text" id="alertText" value="Thanks for following!">
      </div>
      <button onclick="sendAlert()">Send Alert</button>
    </div>

    <!-- Actions -->
    <div class="section">
      <h2>⚙️ Actions</h2>
      <button onclick="getStats()">Get Stats</button>
      <button class="secondary" onclick="clearChat()">Clear Chat</button>
      <button class="danger" onclick="resetGoal()">Reset Goal</button>
    </div>

    <!-- Event Log -->
    <div class="section">
      <h2>📊 Event Log</h2>
      <div id="eventLog" class="log"></div>
      <button onclick="clearLog()">Clear Log</button>
    </div>
  </div>

  <script src="umbra-client.js"></script>
  <script>
    let client = null;

    function log(message, type = 'info') {
      const logDiv = document.getElementById('eventLog');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.insertBefore(entry, logDiv.firstChild);
    }

    function updateConnectionStatus(connected) {
      const status = document.getElementById('connectionStatus');
      if (connected) {
        status.className = 'status connected';
        status.textContent = '✅ Connected';
      } else {
        status.className = 'status disconnected';
        status.textContent = '❌ Disconnected';
      }
    }

    async function connectWebSocket() {
      const apiKey = document.getElementById('apiKey').value;
      if (!apiKey) {
        alert('Please enter API key');
        return;
      }

      try {
        client = new UmbraClient(apiKey);

        // Setup event handlers
        client.on('connected', () => {
          log('WebSocket connected', 'info');
          updateConnectionStatus(true);
        });

        client.on('donation', (data) => {
          log(`Donation: ${data.name} - ${data.amount} ${data.currency}`, 'donation');
        });

        client.on('message', (data) => {
          log(`Message: ${data.author}: ${data.text}`, 'message');
        });

        client.on('alert', (data) => {
          log(`Alert: ${data.title} - ${data.text}`, 'alert');
        });

        client.on('goal_update', (data) => {
          log(`Goal updated: ${data.current}/${data.target}`, 'info');
        });

        await client.connect();
      } catch (e) {
        log(`Connection error: ${e.message}`, 'error');
        updateConnectionStatus(false);
      }
    }

    function disconnectWebSocket() {
      if (client) {
        client.disconnect();
        updateConnectionStatus(false);
        log('Disconnected', 'info');
      }
    }

    async function sendDonation() {
      if (!client) {
        alert('Connect WebSocket first');
        return;
      }

      try {
        const name = document.getElementById('donName').value;
        const amount = document.getElementById('donAmount').value;
        const message = document.getElementById('donMessage').value;

        await client.sendDonation(name, amount, message);
        log(`Sent donation: ${name} - ${amount}`, 'donation');
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function sendMessage() {
      if (!client) {
        alert('Connect WebSocket first');
        return;
      }

      try {
        const author = document.getElementById('msgAuthor').value;
        const text = document.getElementById('msgText').value;

        await client.sendMessage(author, text);
        log(`Sent message: ${author}: ${text}`, 'message');
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function sendAlert() {
      if (!client) {
        alert('Connect WebSocket first');
        return;
      }

      try {
        const title = document.getElementById('alertTitle').value;
        const text = document.getElementById('alertText').value;

        await client.sendAlert(title, text);
        log(`Sent alert: ${title}`, 'alert');
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function getStats() {
      if (!client) {
        alert('Connect WebSocket first');
        return;
      }

      try {
        const stats = await client.getStats();
        log(`Stats: Goal ${stats.goal.current}/${stats.goal.target}, Donations: ${stats.history.donations}`, 'info');
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function clearChat() {
      if (!client) {
        alert('Connect WebSocket first');
        return;
      }

      try {
        await client.clearChat();
        log('Chat cleared', 'info');
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function resetGoal() {
      if (!client) {
        alert('Connect WebSocket first');
        return;
      }

      if (!confirm('Reset goal progress?')) return;

      try {
        await client.resetGoal();
        log('Goal reset', 'info');
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    function clearLog() {
      document.getElementById('eventLog').innerHTML = '';
    }
  </script>
</body>
</html>
